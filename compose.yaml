services:
  mariadb:
    image: mariadb:latest
    container_name: localdb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mi_base
      MARIADB_USER: imdf
      MARIADB_PASSWORD: 1234

    ports:
      - "3306:3306"

    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
